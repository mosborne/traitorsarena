<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Summary - The Traitors</title>
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --accent-red: #e94560;
            --accent-gold: #f4a261;
            --accent-green: #2a9d8f;
            --text-light: #eee;
            --text-muted: #888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            padding: 2rem 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            border-bottom: 3px solid var(--accent-red);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--accent-red);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        .back-link {
            color: var(--accent-gold);
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        section {
            margin: 2rem 0;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h2 {
            color: var(--accent-gold);
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-light);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .traitor-text {
            color: var(--accent-red);
        }

        .faithful-text {
            color: var(--accent-green);
        }

        .contestant-table {
            width: 100%;
            border-collapse: collapse;
        }

        .contestant-table th,
        .contestant-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .contestant-table th {
            cursor: pointer;
            user-select: none;
            color: var(--accent-gold);
        }

        .contestant-table th:hover {
            background: rgba(255,255,255,0.05);
        }

        .contestant-table th.sorted-asc::after { content: ' ▲'; }
        .contestant-table th.sorted-desc::after { content: ' ▼'; }

        .contestant-table tbody tr:hover {
            background: rgba(255,255,255,0.05);
        }

        .contestant-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: bold;
        }

        .contestant-link:hover {
            text-decoration: underline;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .game-card {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            color: var(--text-light);
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }

        .game-card:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--accent-gold);
        }

        .game-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .game-winner {
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
        }

        .error {
            text-align: center;
            color: var(--accent-red);
            padding: 2rem;
        }

        #analysis-content {
            line-height: 1.8;
        }

        #analysis-content p {
            margin-bottom: 1rem;
        }

        .analysis-meta {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 1rem;
            font-style: italic;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1 id="run-title">Loading...</h1>
        <p class="subtitle" id="run-config"></p>
        <a href="index.html" class="back-link" id="back-link">&larr; Back to all runs</a>
    </header>

    <div class="container">
        <section>
            <h2>Run Statistics</h2>
            <div class="stats-grid" id="stats-grid">
                <div class="loading">Loading statistics...</div>
            </div>
        </section>

        <section id="analysis-section" style="display: none;">
            <h2>Run Analysis</h2>
            <div id="analysis-content"></div>
            <p class="analysis-meta" id="analysis-meta"></p>
        </section>

        <section>
            <h2>Contestant Performance</h2>
            <div id="contestant-container">
                <div class="loading">Loading contestants...</div>
            </div>
        </section>

        <section>
            <h2>Games</h2>
            <div class="games-grid" id="games-grid">
                <div class="loading">Loading games...</div>
            </div>
        </section>
    </div>

    <footer>
        <p>The Traitors LLM Simulator - Powered by Claude AI</p>
    </footer>

    <script>
        function getRunId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('run');
        }

        function getArchiveId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('archive');
        }

        function getRunPath(runId, archiveId) {
            if (archiveId) {
                return `data/archives/${archiveId}/runs/${runId}`;
            }
            return `runs/${runId}`;
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString('en-US', {
                month: 'long',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatDuration(seconds) {
            if (!seconds || seconds === 0) return '-';
            if (seconds < 60) return `${Math.round(seconds)}s`;
            const mins = Math.floor(seconds / 60);
            const secs = Math.round(seconds % 60);
            if (mins >= 60) {
                const hours = Math.floor(mins / 60);
                const remainMins = mins % 60;
                return remainMins > 0 ? `${hours}h\u00A0${remainMins}m` : `${hours}h`;
            }
            return secs > 0 ? `${mins}m\u00A0${secs}s` : `${mins}m`;
        }

        function formatCost(cost) {
            if (!cost || cost === 0) return '-';
            return `$${cost.toFixed(2)}`;
        }

        function formatNumber(num) {
            if (!num || num === 0) return '-';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toLocaleString();
        }

        function formatModelName(model) {
            if (!model) return '-';
            const map = {
                'claude-3-5-haiku-20241022': 'Haiku',
                'claude-3-5-sonnet-20241022': 'Sonnet',
                'claude-opus-4-20250514': 'Opus',
                'llama3.2': 'Llama 3.2',
                'llama3.2:latest': 'Llama 3.2',
                'gemini-2.0-flash': 'Gemini 2.0 Flash',
                'gemini-2.0-flash-001': 'Gemini 2.0 Flash',
            };
            return map[model] || model;
        }

        function renderStats(data) {
            const stats = data.stats || {};
            const traitorRate = stats.total_games > 0
                ? Math.round((stats.traitor_wins / stats.total_games) * 100)
                : 0;

            // Pool mode info
            const poolSize = data.pool_size;
            const numContestants = data.contestants ? data.contestants.length : 19;
            const poolCard = poolSize ? `
                <div class="stat-card">
                    <div class="stat-value">${poolSize}</div>
                    <div class="stat-label">Player Pool (19 per game)</div>
                </div>
            ` : `
                <div class="stat-card">
                    <div class="stat-value">${numContestants}</div>
                    <div class="stat-label">Contestants</div>
                </div>
            `;

            // Cost/duration cards (only if data exists)
            const hasCostData = stats.total_cost_usd && stats.total_cost_usd > 0;
            const costCards = hasCostData ? `
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--accent-gold);">${formatCost(stats.total_cost_usd)}</div>
                    <div class="stat-label">Total Cost</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${formatDuration(stats.total_duration_sec)}</div>
                    <div class="stat-label">Total Duration</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--accent-gold);">${formatCost(stats.avg_cost_usd)}</div>
                    <div class="stat-label">Avg Cost/Game</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${formatDuration(stats.avg_duration_sec)}</div>
                    <div class="stat-label">Avg Duration/Game</div>
                </div>
            ` : '';

            // Model and token stats
            const models = [...new Set(Object.values(data.contestant_stats || {})
                .map(c => c.model).filter(Boolean))];
            const modelDisplay = models.length === 1 ? formatModelName(models[0]) :
                models.length > 1 ? `${models.length} models` : 'Unknown';

            const tokenStats = stats.total_input_tokens ? `
                <div class="stat-card">
                    <div class="stat-value" style="font-size: 1.2rem;">${modelDisplay}</div>
                    <div class="stat-label">Model</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${formatNumber(stats.total_input_tokens)}</div>
                    <div class="stat-label">Input Tokens</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${formatNumber(stats.total_output_tokens)}</div>
                    <div class="stat-label">Output Tokens</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${formatNumber(stats.total_cache_read_tokens)}</div>
                    <div class="stat-label">Cache Hits</div>
                </div>
            ` : '';

            return `
                <div class="stat-card">
                    <div class="stat-value">${stats.total_games || 0}</div>
                    <div class="stat-label">Total Games</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value traitor-text">${stats.traitor_wins || 0}</div>
                    <div class="stat-label">Traitor Wins</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value faithful-text">${stats.faithful_wins || 0}</div>
                    <div class="stat-label">Faithful Wins</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--accent-red);">${traitorRate}%</div>
                    <div class="stat-label">Traitor Win Rate</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${(stats.avg_rounds || 0).toFixed(1)}</div>
                    <div class="stat-label">Avg Rounds</div>
                </div>
                ${poolCard}
                <div class="stat-card">
                    <div class="stat-value">${data.num_traitors || 3}</div>
                    <div class="stat-label">Traitors per Game</div>
                </div>
                ${costCards}
                ${tokenStats}
            `;
        }

        let currentSort = { column: 'wins', ascending: false };
        let contestantData = null;

        function renderContestantsTable(data) {
            contestantData = data;
            const stats = data.contestant_stats || {};

            if (Object.keys(stats).length === 0) {
                return '<p style="color: var(--text-muted);">No stats available.</p>';
            }

            const sortedEntries = Object.entries(stats).sort((a, b) => {
                let aVal, bVal;
                if (currentSort.column === 'name') {
                    aVal = a[1].name || a[0];
                    bVal = b[1].name || b[0];
                } else if (currentSort.column === 'model') {
                    aVal = a[1].model || '';
                    bVal = b[1].model || '';
                } else {
                    aVal = a[1][currentSort.column] ?? 0;
                    bVal = b[1][currentSort.column] ?? 0;
                }
                const cmp = typeof aVal === 'string' ? aVal.localeCompare(bVal) : aVal - bVal;
                return currentSort.ascending ? cmp : -cmp;
            });

            const headers = [
                { key: 'name', label: 'Name' },
                { key: 'model', label: 'Model' },
                { key: 'wins', label: 'Wins' },
                { key: 'games_played', label: 'Games' },
                { key: 'times_traitor', label: 'Traitor' },
                { key: 'times_faithful', label: 'Faithful' },
                { key: 'survived', label: 'Survived' },
                { key: 'banished', label: 'Banished' },
                { key: 'murdered', label: 'Murdered' },
                { key: 'total_prize', label: 'Prize' }
            ];

            const headerHtml = headers.map(h => {
                const sortClass = currentSort.column === h.key
                    ? (currentSort.ascending ? 'sorted-asc' : 'sorted-desc') : '';
                return `<th class="${sortClass}" data-sort="${h.key}">${h.label}</th>`;
            }).join('');

            const rowsHtml = sortedEntries.map(([key, s]) => {
                // Use name from stats (composite key format: "name|model")
                const displayName = s.name || key.split('|')[0];
                const winRate = s.games_played > 0 ? Math.round((s.wins / s.games_played) * 100) : 0;
                return `<tr>
                    <td><a class="contestant-link" href="players.html#${encodeURIComponent(displayName)}">${displayName}</a></td>
                    <td>${formatModelName(s.model)}</td>
                    <td>${s.wins} (${winRate}%)</td>
                    <td>${s.games_played}</td>
                    <td class="traitor-text">${s.times_traitor}</td>
                    <td class="faithful-text">${s.times_faithful}</td>
                    <td>${s.survived}</td>
                    <td>${s.banished}</td>
                    <td>${s.murdered}</td>
                    <td>$${(s.total_prize || 0).toLocaleString()}</td>
                </tr>`;
            }).join('');

            return `<table class="contestant-table">
                <thead><tr>${headerHtml}</tr></thead>
                <tbody>${rowsHtml}</tbody>
            </table>`;
        }

        function setupTableSorting() {
            document.querySelectorAll('.contestant-table th').forEach(th => {
                th.addEventListener('click', () => {
                    const col = th.dataset.sort;
                    if (currentSort.column === col) {
                        currentSort.ascending = !currentSort.ascending;
                    } else {
                        currentSort = { column: col, ascending: col === 'name' };
                    }
                    document.getElementById('contestant-container').innerHTML =
                        renderContestantsTable(contestantData);
                    setupTableSorting();
                });
            });
        }

        function renderAnalysis(data) {
            const section = document.getElementById('analysis-section');
            if (data.analysis && data.analysis.content) {
                section.style.display = 'block';
                // Convert newlines to paragraphs
                const paragraphs = data.analysis.content.split('\n\n')
                    .filter(p => p.trim())
                    .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
                    .join('');
                document.getElementById('analysis-content').innerHTML = paragraphs;

                const modelName = data.analysis.model === 'claude-opus-4-20250514'
                    ? 'Claude Opus 4' : data.analysis.model;
                document.getElementById('analysis-meta').textContent =
                    `Analysis by ${modelName} • ${formatDate(data.analysis.generated_at)}`;
            }
        }

        function renderGames(data, runId, archiveId) {
            const games = data.games || [];
            const gamesCosts = data.games_costs || [];
            const gamesDurations = data.games_durations || [];

            if (games.length === 0) {
                return '<p style="color: var(--text-muted); font-style: italic;">No games found.</p>';
            }

            // For legacy runs, link to HTML files. For JSON runs, link to game.html
            const isLegacy = data.legacy === true;

            return games.map((gameNum, index) => {
                let gameUrl;
                if (isLegacy) {
                    gameUrl = `runs/${runId}/game_${gameNum}.html`;
                } else if (archiveId) {
                    gameUrl = `game.html?archive=${archiveId}&run=${runId}&game=${gameNum}`;
                } else {
                    gameUrl = `game.html?run=${runId}&game=${gameNum}`;
                }

                const cost = gamesCosts[index];
                const duration = gamesDurations[index];
                const hasCostData = cost && cost > 0;

                const costDurationHtml = hasCostData ? `
                    <div class="game-meta" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">
                        ${formatCost(cost)} · ${formatDuration(duration)}
                    </div>
                ` : '';

                return `
                    <a href="${gameUrl}" class="game-card">
                        <div class="game-number">Game ${gameNum}</div>
                        <div class="game-winner">View transcript</div>
                        ${costDurationHtml}
                    </a>
                `;
            }).join('');
        }

        async function loadRun() {
            const runId = getRunId();
            const archiveId = getArchiveId();

            if (!runId) {
                document.getElementById('run-title').textContent = 'Error';
                document.getElementById('stats-grid').innerHTML = '<div class="error">No run ID specified</div>';
                return;
            }

            // Update back link based on archive context
            const backLink = document.getElementById('back-link');
            if (archiveId) {
                backLink.href = `archives.html?archive=${archiveId}`;
                backLink.textContent = '\u2190 Back to archive';
            }

            const runPath = getRunPath(runId, archiveId);

            try {
                const response = await fetch(`${runPath}/run.json`);
                if (!response.ok) throw new Error('Run not found');

                const data = await response.json();

                // Update header
                document.getElementById('run-title').textContent = formatDate(data.timestamp);
                let configText = `${data.config_name}${data.config_description ? ' - ' + data.config_description : ''}`;
                if (archiveId) {
                    configText = `[Archived] ${configText}`;
                }
                document.getElementById('run-config').textContent = configText;
                document.title = `Run ${runId} - The Traitors`;

                // Update stats
                document.getElementById('stats-grid').innerHTML = renderStats(data);

                // Update analysis
                renderAnalysis(data);

                // Update contestants
                document.getElementById('contestant-container').innerHTML = renderContestantsTable(data);
                setupTableSorting();

                // Update games
                document.getElementById('games-grid').innerHTML = renderGames(data, runId, archiveId);

            } catch (error) {
                console.error('Error loading run:', error);
                document.getElementById('run-title').textContent = 'Error';
                document.getElementById('stats-grid').innerHTML = `<div class="error">Failed to load run data: ${error.message}</div>`;
                document.getElementById('contestant-container').innerHTML = '';
                document.getElementById('games-grid').innerHTML = '';
            }
        }

        document.addEventListener('DOMContentLoaded', loadRun);
    </script>
</body>
</html>
